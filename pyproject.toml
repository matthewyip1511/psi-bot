[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "singapore-psi-telegram-bot"
version = "1.0.0"
description = "Hourly Singapore PSI and PM2.5 updates for a Telegram channel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "python-telegram-bot[job-queue]>=22.8,<23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5,<8",
    "ruff>=0.11,<1",
]

[project.scripts]
psi-bot = "psi_bot.bot:main"
psi-channel-id = "psi_bot.channel_id:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
